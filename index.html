<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1662 BCP</title>
    <style>
        /* Basic styling for our app */
        body {
            font-family: Georgia, serif;
            margin: 0;
            padding: 20px;
            background-color: #fdfdfc;
            color: #1a1a1a;
            transition: all 0.3s ease;
        }
        /* Dark Mode */
        .dark-mode {
            background-color: #121212;
            color: #e0e0e0;
        }
        .header {
            text-align: center;
            position: sticky;
            top: 0;
            background: inherit;
            padding-bottom: 10px;
            border-bottom: 1px solid #ccc;
        }
        button {
            padding: 10px 15px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #666;
            background: #eee;
            border-radius: 5px;
        }
        .dark-mode button { background: #333; color: white; }
        #text-container { margin-top: 20px; line-height: 1.6; font-size: 18px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Daily Office 1662</h2>
        <h4 id="date-display" style="margin-top: 0; color: #666;"></h4>
        <!-- Service Selection Buttons -->
        <button onclick="loadService('Morning Prayer')">Morning Prayer</button>
        <button onclick="loadService('Evening Prayer')">Evening Prayer</button>
        <button onclick="loadService('Holy Communion')">Holy Communion</button>
        <br><br>
        <!-- Customization Controls -->
        <button onclick="toggleDarkMode()">Dark Mode</button>
        <button onclick="changeFontSize(2)">A+</button>
        <button onclick="changeFontSize(-2)">A-</button>
    </div>

    <!-- This is where the liturgy will be injected -->
    <div id="text-container">
        <p><i>Select a service above to begin.</i></p>
    </div>

    <!-- 1. Load the text library FIRST -->
    <script src="bcp.js"></script>

    <!-- 2. Run the logic engine SECOND -->
<script>
    // --- 1. SET UP THE DATE ---
    let today = new Date();
    let dayOfWeek = today.getDay(); 
    let dayOfMonth = today.getDate(); 
    
    // Create a YYYY-MM-DD string to look up in our lectionary
    let year = today.getFullYear();
    let month = String(today.getMonth() + 1).padStart(2, '0');
    let day = String(today.getDate()).padStart(2, '0');
    let dateString = `${year}-${month}-${day}`; 
    
    let options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('date-display').innerText = today.toLocaleDateString('en-US', options);

    // --- 2. UI CONTROLS ---
    function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }
    let currentFontSize = 18;
    function changeFontSize(change) {
        currentFontSize += change;
        document.getElementById('text-container').style.fontSize = currentFontSize + 'px';
    }

    // --- 3. SERVICE BUILDER ---
    function loadService(serviceName) {
        let container = document.getElementById('text-container');
        
        if(serviceName === 'Morning Prayer') {
            // Look up today's data in the lectionary
            let todaysData = bcp.lectionary[dateString];

            let serviceText = 
                bcp.morningPrayer.title + 
                bcp.morningPrayer.exhortation + 
                bcp.morningPrayer.confession + 
                bcp.morningPrayer.absolution + 
                bcp.morningPrayer.lordsPrayer + 
                bcp.morningPrayer.preces;
            
            // Add Venite
            serviceText += bcp.morningPrayer.venite;
            
            // Add Psalms
            let psalmDay = dayOfMonth === 31 ? 30 : dayOfMonth;
            if (bcp.psalter["day" + psalmDay]) {
                serviceText += bcp.psalter["day" + psalmDay].morning;
            } else {
                serviceText += "<p><i>[Psalms for Day " + psalmDay + " missing]</i></p>";
            }

            // Add Lessons, Canticles, and the Collect if Lectionary data exists
            if (todaysData) {
                let firstRef = todaysData.mpFirstLesson;
                let secondRef = todaysData.mpSecondLesson;
                
                serviceText += "<h3>The First Lesson: " + firstRef + "</h3>";
                serviceText += bcp.bible[firstRef] || "<p>[Text missing]</p>";
                
                serviceText += bcp.morningPrayer.teDeum;
                
                serviceText += "<h3>The Second Lesson: " + secondRef + "</h3>";
                serviceText += bcp.bible[secondRef] || "<p>[Text missing]</p>";
                
                serviceText += bcp.morningPrayer.jubilate;

                // Add the Collect of the Day
                serviceText += todaysData.collect;
            } else {
                serviceText += "<p><i>[No Lectionary data found for " + dateString + "]</i></p>";
            }
            
            // Add Litany on Wed, Fri, Sun
            if (dayOfWeek === 3 || dayOfWeek === 5 || dayOfWeek === 0) {
                serviceText += bcp.litany.title + bcp.litany.text;
            }
            
            container.innerHTML = serviceText;

        } else {
            container.innerHTML = "<p>Coming soon...</p>";
        }
    }
</script>
</body>
</html>
