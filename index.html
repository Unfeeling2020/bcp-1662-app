<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1662 BCP</title>
    <style>
        /* Basic styling for our app */
        body {
            font-family: Georgia, serif;
            margin: 0;
            padding: 20px;
            background-color: #fdfdfc;
            color: #1a1a1a;
            transition: all 0.3s ease;
        }
        /* Dark Mode */
        .dark-mode {
            background-color: #121212;
            color: #e0e0e0;
        }
        .header {
            text-align: center;
            position: sticky;
            top: 0;
            background: inherit;
            padding-bottom: 10px;
            border-bottom: 1px solid #ccc;
        }
        button {
            padding: 10px 15px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #666;
            background: #eee;
            border-radius: 5px;
        }
        .dark-mode button { background: #333; color: white; }
        #text-container { margin-top: 20px; line-height: 1.6; font-size: 18px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Daily Office 1662</h2>
        <h4 id="date-display" style="margin-top: 0; color: #666;"></h4>
        <!-- Service Selection Buttons -->
        <button onclick="loadService('Morning Prayer')">Morning Prayer</button>
        <button onclick="loadService('Evening Prayer')">Evening Prayer</button>
        <button onclick="loadService('Holy Communion')">Holy Communion</button>
        <br><br>
        <!-- Customization Controls -->
        <button onclick="toggleDarkMode()">Dark Mode</button>
        <button onclick="changeFontSize(2)">A+</button>
        <button onclick="changeFontSize(-2)">A-</button>
    </div>

    <!-- This is where the liturgy will be injected -->
    <div id="text-container">
        <p><i>Select a service above to begin.</i></p>
    </div>

    <!-- 1. Load the text libraries FIRST -->
    <script src="lectionary.js"></script>
    <script src="bcp.js"></script>
    <script src="collects.js"></script>

    <!-- 2. Run the logic engine SECOND -->
    <script>
        // --- 1. SET UP THE DATE ---
        let today = new Date();
        let dayOfWeek = today.getDay(); 
        let dayOfMonth = today.getDate(); 

        // Create a MM-DD string to look up in your Excel data
        let month = String(today.getMonth() + 1).padStart(2, '0');
        let day = String(today.getDate()).padStart(2, '0');
        let mmdd = `${month}-${day}`;
        
        // Display the date on the screen
        let options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('date-display').innerText = today.toLocaleDateString('en-US', options);

        // --- 2. UI CONTROLS ---
        function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }
        let currentFontSize = 18;
        function changeFontSize(change) {
            currentFontSize += change;
            document.getElementById('text-container').style.fontSize = currentFontSize + 'px';
        }

        // --- 3. BIBLE LINK ENGINE ---
        function createBibleLink(reference) {
            if (!reference || reference === "Proper Lesson") {
                return "<p><i>[Proper Lesson]</i></p>";
            }
            // Formats the reference for a URL (e.g., "Jonah 4" becomes "Jonah%204")
            let encodedRef = encodeURIComponent(reference);
            let url = "https://www.biblegateway.com/passage/?search=" + encodedRef + "&version=AKJV";
            
            // Returns a nice clickable button
            return "<p><a href='" + url + "' target='_blank' style='display: inline-block; padding: 10px 15px; margin: 5px 0; background-color: #e0e0e0; color: #1a1a1a; text-decoration: none; border-radius: 5px; font-weight: bold;'>📖 Read " + reference + "</a></p>";
        }

        // --- 4. LITURGICAL CALENDAR ENGINE ---
        function getLiturgicalKey(date) {
            let year = date.getFullYear();
            
            // 1. Calculate Easter for the current year
            let a = year % 19, b = Math.floor(year / 100), c = year % 100;
            let d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
            let h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
            let l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
            let easterMonth = Math.floor((h + l - 7 * m + 114) / 31) - 1;
            let easterDay = ((h + l - 7 * m + 114) % 31) + 1;
            
            let easter = new Date(year, easterMonth, easterDay);
            
            // 2. Find the difference in days between TODAY and EASTER
            let todayMidnight = new Date(year, date.getMonth(), date.getDate());
            let diffTime = todayMidnight.getTime() - easter.getTime();
            let diffDays = Math.floor(diffTime / (1000 * 3600 * 24));
            
            // 3. Fixed Holy Days (Civil Calendar)
            let currentMonth = date.getMonth(); 
            let currentDay = date.getDate();
            if (currentMonth === 11 && currentDay === 25) return "ChristmasDay";
            
            // 4. Movable Feasts (Easter Calendar)
            if (diffDays === 0) return "EasterDay";
            if (diffDays === -46) return "AshWednesday";
            if (diffDays === 39) return "AscensionDay";
            if (diffDays === 49) return "Pentecost";
            if (diffDays === 56) return "TrinitySunday";
            
            // Fallback for days not yet programmed
            return "Default";
        }

        // --- 5. SERVICE BUILDER ---
        function loadService(serviceName) {
            let container = document.getElementById('text-container');
            
            if(serviceName === 'Morning Prayer') {
                // Look up today's data in the EXCEL lectionary
                let todaysData = fixedLectionary[mmdd];

                let serviceText = 
                    bcp.morningPrayer.title + 
                    bcp.morningPrayer.exhortation + 
                    bcp.morningPrayer.confession + 
                    bcp.morningPrayer.absolution + 
                    bcp.morningPrayer.lordsPrayer + 
                    bcp.morningPrayer.preces;
                
                // Add Venite
                serviceText += bcp.morningPrayer.venite;
                
                // Add Psalms
                let psalmDay = dayOfMonth === 31 ? 30 : dayOfMonth;
                if (bcp.psalter && bcp.psalter["day" + psalmDay]) {
                    serviceText += bcp.psalter["day" + psalmDay].morning;
                } else {
                    serviceText += "<p><i>[Psalms for Day " + psalmDay + " missing]</i></p>";
                }

                // Add Lessons, Canticles, and the Collect
                if (todaysData) {
                    let firstRef = todaysData.mpFirst;
                    let secondRef = todaysData.mpSecond;
                    
                    serviceText += "<h3>The First Lesson: " + firstRef + "</h3>";
                    serviceText += createBibleLink(firstRef);
                    
                    serviceText += bcp.morningPrayer.teDeum;
                    
                    serviceText += "<h3>The Second Lesson: " + secondRef + "</h3>";
                    serviceText += createBibleLink(secondRef);
                    
                    serviceText += bcp.morningPrayer.jubilate;

                    // Calculate the Liturgical Day and Add the Collect
                    let liturgicalKey = getLiturgicalKey(today);
                    serviceText += bcpCollects[liturgicalKey] || bcpCollects["Default"];
                } else {
                    serviceText += "<p><i>[No Lectionary data found for " + mmdd + "]</i></p>";
                }
                
                // Add Litany on Wed, Fri, Sun
                if (dayOfWeek === 3 || dayOfWeek === 5 || dayOfWeek === 0) {
                    serviceText += bcp.litany.title + bcp.litany.text;
                }
                
                container.innerHTML = serviceText;

            } else {
                container.innerHTML = "<p>Coming soon...</p>";
            }
        }
    </script>
</body>
</html>
